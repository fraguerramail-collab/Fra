{% extends "base.html" %}
{% block title %}Regole - Gestione Turni{% endblock %}
{% block content %}
<h1>Regole globali</h1>

<div class="card">
  <form method="post" action="{{ url_for('main.rules') }}">
    <label>Giorni lavorativi consecutivi massimi<br>
      <input type="number" name="max_consecutive_work_days" min="1" max="31" value="{{ settings.max_consecutive_work_days }}">
    </label>
    <p><small>Le altre regole (smonto, distanza minima tra turni, skill, riposo settimanale via corsia/weekend) si configurano direttamente su ogni <a href="{{ url_for('main.shift_types') }}">tipo di turno</a>.</small></p>
    <button type="submit">Salva</button>
  </form>
</div>
{% endblock %}
